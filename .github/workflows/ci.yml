name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# En un pull request sólo interesa el último estado propuesto, así que los
# runs anteriores se agrupan y se cancelan. En main, en cambio, cada commit
# entra en su propio grupo —de ahí el sha— para que ninguno quede sin
# verificar: un grupo compartido descarta los runs en cola aunque
# cancel-in-progress esté desactivado, y un run cancelado se confunde a simple
# vista con uno fallido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compilación y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Preparar Gradle con caché
        uses: gradle/actions/setup-gradle@v6

      # El runner de GitHub trae Docker, así que los tests de integración
      # levantan PostgreSQL con Testcontainers igual que en local: no hay una
      # suite reducida "de CI" que pruebe menos que la del portátil.
      - name: Compilar y ejecutar las pruebas
        run: ./gradlew build --no-daemon

      - name: Publicar el informe de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  docker:
    name: Construcción de la imagen
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t franchise-management-api:${{ github.sha }} .
